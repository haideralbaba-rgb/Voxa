    <text x="94" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" letter-spacing="10" fill-opacity="0.72">FILM FESTIVAL</text>
  </g>
  <line x1="88" y1="612" x2="1312" y2="612" stroke="#fff" stroke-opacity="0.28"/>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="2.6" fill="#fff" fill-opacity="0.66">
