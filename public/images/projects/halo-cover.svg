<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000" role="img">
  
  <defs>
    <linearGradient id="bg-halo-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c0d"/>
      <stop offset="0.55" stop-color="#b0453f"/>
      <stop offset="1" stop-color="#f0b3ae"/>
    </linearGradient>
    <radialGradient id="glow-halo-cover" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#f0b3ae" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#b0453f" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1a0c0d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2-halo-cover" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#1a0c0d" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1a0c0d" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-halo-cover" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="blur-halo-cover" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain-halo-cover" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="shadow-halo-cover" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#1a0c0d" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="glass-halo-cover" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sheen-halo-cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="1000" fill="#1a0c0d"/>
  <g filter="url(#soft-halo-cover)" opacity="0.9">
    <ellipse cx="1080" cy="300" rx="420" ry="360" fill="#b0453f" fill-opacity="0.85"/>
    <ellipse cx="1180" cy="760" rx="320" ry="260" fill="#f0b3ae" fill-opacity="0.65"/>
