<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img">
  
  <defs>
    <linearGradient id="bg-manuscript-01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191226"/>
      <stop offset="0.55" stop-color="#8c6fa8"/>
      <stop offset="1" stop-color="#d6c6e6"/>
    </linearGradient>
    <radialGradient id="glow-manuscript-01" cx="0.28" cy="0.18" r="0.85">
      <stop offset="0" stop-color="#d6c6e6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#8c6fa8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#191226" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2-manuscript-01" cx="0.85" cy="0.9" r="0.7">
      <stop offset="0" stop-color="#191226" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#191226" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-manuscript-01" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="blur-manuscript-01" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain-manuscript-01" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="shadow-manuscript-01" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#191226" flood-opacity="0.5"/>
    </filter>
    <linearGradient id="glass-manuscript-01" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="sheen-manuscript-01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.14"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg-manuscript-01)"/>
  <rect width="1600" height="1000" fill="url(#glow-manuscript-01)"/>
  <rect width="1600" height="1000" fill="url(#glow2-manuscript-01)"/>
  <g filter="url(#soft-manuscript-01)" opacity="0.75">
    <ellipse cx="1180" cy="330" rx="380" ry="300" fill="#ffffff" fill-opacity="0.32"/>
    <ellipse cx="1420" cy="760" rx="300" ry="220" fill="#191226" fill-opacity="0.5"/>
  </g>
  <circle cx="1140" cy="470" r="210" fill="none" stroke="#fff" stroke-opacity="0.26" stroke-width="2.4"/><circle cx="1140" cy="470" r="288" fill="none" stroke="#fff" stroke-opacity="0.222" stroke-width="2.15"/><circle cx="1140" cy="470" r="366" fill="none" stroke="#fff" stroke-opacity="0.184" stroke-width="1.9"/><circle cx="1140" cy="470" r="444" fill="none" stroke="#fff" stroke-opacity="0.14600000000000002" stroke-width="1.65"/><circle cx="1140" cy="470" r="522" fill="none" stroke="#fff" stroke-opacity="0.10800000000000001" stroke-width="1.4"/>
  <circle cx="1140" cy="470" r="118" fill="url(#glass-manuscript-01)" stroke="#ffffff" stroke-opacity="0.45"/>
  <circle cx="1140" cy="470" r="46" fill="#ffffff" fill-opacity="0.9"/>
  <g stroke="#ffffff" stroke-opacity="0.35">
    <line x1="72" y1="900" x2="1528" y2="900"/>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="15" letter-spacing="3.4" fill="rgba(255,255,255,0.68)">
    <text x="72" y="86">MANUSCRIPT</text>
    <text x="1528" y="86" text-anchor="end">EDITORIAL</text>
  </g>
  <g fill="#ffffff">
    <text x="72" y="766" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="600" letter-spacing="-4">Issue 04</text>
    <text x="72" y="840" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-style="italic" fill-opacity="0.82">On attention and repair</text>
  </g>
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" letter-spacing="2.6" fill="rgba(255,255,255,0.62)">
    <text x="1528" y="850" text-anchor="end">COVER STORY</text>
  </g>
  <rect width="1600" height="1000" filter="url(#grain-manuscript-01)" opacity="0.2" style="mix-blend-mode:overlay"/>
