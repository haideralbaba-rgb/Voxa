<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>

  </defs>
  <rect width="1200" height="1500" fill="#08080a"/>

  <ellipse cx="600" cy="780" rx="460" ry="420" fill="#2a1a13" filter="url(#blur)" opacity="0.9"/>
  <g transform="translate(600 780) rotate(-70)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g><g transform="translate(600 780) rotate(-42)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g><g transform="translate(600 780) rotate(-14)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g><g transform="translate(600 780) rotate(14)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g><g transform="translate(600 780) rotate(42)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g><g transform="translate(600 780) rotate(70)"><rect x="-190" y="-250" width="380" height="500" rx="24" fill="#111116" stroke="#ffffff" stroke-opacity="0.14"/></g>
  <circle cx="600" cy="780" r="70" fill="#e08a5f" filter="url(#soft)" opacity="0.9"/>
  <circle cx="600" cy="780" r="34" fill="#ffe8da"/>

  <rect width="1200" height="1500" fill="url(#vign)"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.06"/>
</svg>