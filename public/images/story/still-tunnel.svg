<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>

  </defs>
  <rect width="1200" height="1500" fill="#08080a"/>

  <ellipse cx="600" cy="760" rx="300" ry="360" fill="#4a2413" filter="url(#blur)" opacity="0.9"/>
  <ellipse cx="600" cy="760" rx="90" ry="110" fill="#ffd7c0" filter="url(#blur)" opacity="0.8"/>
  <rect x="150" y="200" width="900" height="1120" rx="28" fill="none" stroke="#e08a5f" stroke-opacity="0.55" stroke-width="2"/><rect x="188" y="248" width="824" height="1025" rx="26" fill="none" stroke="#e08a5f" stroke-opacity="0.50" stroke-width="2"/><rect x="226" y="295" width="747" height="930" rx="23" fill="none" stroke="#e08a5f" stroke-opacity="0.45" stroke-width="2"/><rect x="265" y="343" width="670" height="834" rx="21" fill="none" stroke="#e08a5f" stroke-opacity="0.40" stroke-width="2"/><rect x="303" y="390" width="594" height="739" rx="18" fill="none" stroke="#e08a5f" stroke-opacity="0.35" stroke-width="2"/><rect x="341" y="438" width="518" height="644" rx="16" fill="none" stroke="#e08a5f" stroke-opacity="0.30" stroke-width="2"/><rect x="380" y="486" width="441" height="549" rx="14" fill="none" stroke="#e08a5f" stroke-opacity="0.25" stroke-width="2"/><rect x="418" y="533" width="364" height="454" rx="11" fill="none" stroke="#e08a5f" stroke-opacity="0.20" stroke-width="2"/><rect x="456" y="581" width="288" height="358" rx="9" fill="none" stroke="#e08a5f" stroke-opacity="0.15" stroke-width="2"/>

  <rect width="1200" height="1500" fill="url(#vign)"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.06"/>
</svg>