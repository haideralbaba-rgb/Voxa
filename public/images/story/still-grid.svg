<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" role="img">
  <defs>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
    <linearGradient id="vign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.35"/><stop offset="0.4" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>

  </defs>
  <rect width="1200" height="1500" fill="#08080a"/>

  <ellipse cx="600" cy="500" rx="520" ry="500" fill="#241a14" filter="url(#blur)" opacity="0.9"/>
  <rect x="250" y="330" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="250" y="560" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="250" y="790" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="250" y="1020" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="490" y="330" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="490" y="560" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="490" y="790" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="490" y="1020" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="730" y="330" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="730" y="560" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="730" y="790" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/><rect x="730" y="1020" width="200" height="190" rx="18" fill="#101014" stroke="#ffffff" stroke-opacity="0.12"/>
  <rect x="250" y="420" width="200" height="190" rx="18" fill="#e08a5f" opacity="0.22"/>
  <rect x="490" y="560" width="200" height="190" rx="18" fill="#e08a5f" opacity="0.12"/>
  <rect x="420" y="470" width="360" height="470" rx="34" fill="#0d0d10" stroke="#ffffff" stroke-opacity="0.14"/>
  <rect x="420" y="470" width="360" height="470" rx="34" fill="none" stroke="#f0b79b" stroke-opacity="0.5"/>
  <circle cx="600" cy="700" r="54" fill="#e08a5f" filter="url(#soft)"/>

  <rect width="1200" height="1500" fill="url(#vign)"/>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.06"/>
